name: model-new-watch

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

concurrency:
  group: model-new-watch
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  detect-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect, create PR, and report health
        env:
          OPENAI_API_KEY: ${{ secrets.MODEL_WATCH_OPENAI_KEY }}
          GEMINI_API_KEY: ${{ secrets.MODEL_WATCH_GEMINI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/model-new-watch.mjs
